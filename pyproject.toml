[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxgraph"
version = "0.5.8"
description = "97% cheaper AI coding. ctxgraph builds a knowledge graph of your Python codebase, then generates token-efficient context capsules for any AI tool. Or hook up Ollama/Claude/OpenAI and use it as a code-aware coding assistant — like ChatGPT or Claude Code, but with built-in graph context. Cut token costs by 97%, work offline with just a graph, or connect your favorite LLM."
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Shashi Kundan", email = "shashikundan0001@gmail.com"}
]
keywords = [
    "code-graph", "knowledge-graph", "claude", "code-analysis",
    "ai-context", "token-savings", "ollama", "openai", "ctx",
    "capsule", "python", "codebase", "llm", "code-intelligence",
    "ast", "code-navigation", "dependency-graph",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "typer>=0.9",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/shashi3070/ctxgraph"
Repository = "https://github.com/shashi3070/ctxgraph"
Documentation = "https://github.com/shashi3070/ctxgraph#readme"
Issues = "https://github.com/shashi3070/ctxgraph/issues"
Changelog = "https://github.com/shashi3070/ctxgraph/blob/main/CHANGELOG.md"

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",
    "anyio>=4.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.scripts]
ctx = "ctxgraph.cli.main:app"
ccg = "ctxgraph.wrapper.claude:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ctxgraph = ["skills/*.toml"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
